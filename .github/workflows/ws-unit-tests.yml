name: WS Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ws-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --extra testing

      - name: Run WS unit tests
        run: uv run pytest tests/test_ws_client.py -v
