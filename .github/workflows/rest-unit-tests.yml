name: REST Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rest-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --extra testing

      - name: Run REST unit tests
        run: uv run pytest tests/test_auth.py tests/test_rate_limiter.py tests/test_http_client.py -v --cov=pykalshi --cov-report=term-missing
