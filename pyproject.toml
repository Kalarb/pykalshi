[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pykalshi-client"
dynamic = ["version"]
description = "Async Python client for the Kalshi prediction market API — typed HTTP + WebSocket"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Bailey Faulk", email = "baileyfaulk2003@outlook.com" }]
requires-python = ">=3.11"
keywords = ["kalshi", "prediction-market", "trading", "api-client", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Kalarb/pykalshi"
Repository = "https://github.com/Kalarb/pykalshi"
Issues = "https://github.com/Kalarb/pykalshi/issues"
Changelog = "https://github.com/Kalarb/pykalshi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20.0"]
testing = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "pytest-json-report>=1.5", "pyyaml>=6.0", "python-dotenv>=1.0"]
dev = ["pykalshi-client[otel,testing]", "ruff>=0.1.0", "mypy>=1.5.0"]

[tool.hatch.version]
path = "src/pykalshi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pykalshi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit the real Kalshi DEMO API (require .env credentials)",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
